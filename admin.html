<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | مكتبة فكرة</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body style="background:#f1f5f9;">

  <header class="header">
    <div class="logo-container">
      <img src="logo.jpg" alt="مكتبة فكرة" class="logo-img">
      <div class="logo-text">
        <h1>لوحة تحكم صاحب المتجر</h1>
        <p>إدارة الكتب والأقسام والطلبات لحظياً</p>
      </div>
    </div>
  </header>

  <div class="container" style="display:grid; grid-template-columns: 350px 1fr; gap:25px;">
    
    <!-- عمود الإضافة -->
    <div>
      <!-- إضافة قسم -->
      <div style="background:#fff; padding:20px; border-radius:12px; margin-bottom:20px; border:1px solid #e2e8f0;">
        <h4>📁 إضافة قسم جديد</h4>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <input type="text" id="newCatName" placeholder="اسم القسم الجديد" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:6px;">
          <button class="add-btn" style="margin-top:0; width:80px;" onclick="addCategory()">إضافة</button>
        </div>
      </div>

      <!-- إضافة كتاب -->
      <div style="background:#fff; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
        <h4>📖 إضافة كتاب جديد</h4>
        <div class="form-group" style="margin-top:10px;"><label>عنوان الكتاب *</label><input type="text" id="bookTitle" required></div>
        <div class="form-group"><label>المؤلف</label><input type="text" id="bookAuthor"></div>
        <div class="form-group"><label>القسم *</label><select id="bookCat"></select></div>
        <div class="form-group"><label>السعر (د.أ) *</label><input type="number" id="bookPrice" step="0.5" required></div>
        <div class="form-group"><label>الكمية المتوفرة</label><input type="number" id="bookQty" value="1" min="1"></div>
        <div class="form-group"><label>صورة الغلاف (من جهازك) *</label><input type="file" id="bookImageFile" accept="image/*"></div>
        <div class="form-group"><label>وصف مختصر</label><textarea id="bookDesc" rows="2"></textarea></div>
        <button class="add-btn" onclick="saveBook()">نشر الكتاب في المتجر</button>
      </div>
    </div>

    <!-- عمود العرض والطلبات -->
    <div>
      <div style="background:#fff; padding:20px; border-radius:12px; margin-bottom:25px; border:1px solid #e2e8f0;">
        <h4>📦 الطلبات الواردة لحظياً</h4>
        <div id="ordersList" style="margin-top:15px;"></div>
      </div>

      <div style="background:#fff; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
        <h4>📚 الكتب المتوفرة حالياً في الموقع</h4>
        <div id="adminBooksList" style="margin-top:15px; display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:15px;"></div>
      </div>
    </div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
